<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MedFlow AI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="app-shell">
    <aside class="sidebar" id="sidebar">
        <a class="brand" href="{{ url_for('dashboard') }}">
            <span class="brand-mark"><i class="bi bi-activity"></i></span>
            <span>MedFlow AI</span>
        </a>
        <nav class="nav-list">
            <a href="{{ url_for('dashboard') }}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a href="{{ url_for('patients') }}"><i class="bi bi-people"></i> Patients</a>
            <a href="{{ url_for('appointments') }}"><i class="bi bi-calendar2-week"></i> Appointments</a>
            <a href="{{ url_for('lab_reports') }}"><i class="bi bi-file-earmark-medical"></i> Lab Reports</a>
            <a href="{{ url_for('analytics') }}"><i class="bi bi-graph-up-arrow"></i> Analytics</a>
            <a href="{{ url_for('settings') }}"><i class="bi bi-sliders2"></i> Settings</a>
        </nav>
        <a class="ai-card ai-card-link" href="{{ url_for('ai_tools') }}">
            <i class="bi bi-stars"></i>
            <strong>AI Ready</strong>
            <p>Symptom assistant, report summary, voice entry and OCR modules.</p>
        </a>
    </aside>

    <main class="main">
        <header class="topbar">
            <button class="icon-btn mobile-only" id="sidebarToggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
            <div class="search-box">
                <i class="bi bi-search"></i>
                <input type="search" placeholder="Search patients, reports, appointments">
            </div>
            <button class="icon-btn" aria-label="Notifications"><i class="bi bi-bell"></i><span class="dot"></span></button>
            <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
            <div class="profile">
                <span>{{ current_user.name if current_user else 'Guest' }}</span>
                <small>{{ current_user.role if current_user else 'Visitor' }}</small>
            </div>
        </header>
        <section class="page-content fade-in">
            {% block content %}{% endblock %}
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
