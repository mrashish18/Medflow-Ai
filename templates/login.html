<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - MediCore</title>
    <meta name="application-name" content="MediCore">
    <meta name="apple-mobile-web-app-title" content="MediCore">
    <meta name="description" content="MediCore login for the AI-Powered Hospital Management System.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-body">
    <section class="login-split">
        <div class="login-art">
            <a class="brand" href="{{ url_for('landing') }}"><span class="brand-mark"><i class="bi bi-activity"></i></span> MediCore</a>
            <div class="health-illustration">
                <i class="bi bi-heart-pulse"></i>
                <span class="wave"></span>
            </div>
            <h1>AI-Powered Hospital Management System</h1>
            <p>Smart Hospital & Clinical Workflow Platform for patients, appointments, laboratory workflows, and analytics.</p>
        </div>
        <form class="login-card" method="post">
            <span class="eyebrow">Welcome back</span>
            <h2>Sign in to MediCore</h2>
            {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
            <label>Email</label>
            <input name="email" type="email" value="admin@medicore.ai" required>
            <label>Password</label>
            <input name="password" type="password" value="medicore123" required>
            <div class="form-row">
                <label class="check"><input type="checkbox" checked> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button class="btn-primary" type="submit">Login <i class="bi bi-arrow-right"></i></button>
            <p class="demo-note">Demo: admin@medicore.ai - medicore123</p>
        </form>
    </section>
</body>
</html>
